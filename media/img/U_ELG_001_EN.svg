<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">Current and Power Sign Conventions</title>
<desc id="desc">Both two-terminal elements have six volts. On the left, current enters the positive terminal; on the right, it leaves.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1f5679"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<rect x="18" y="18" width="924" height="564" rx="18" fill="#fff" stroke="#d9dde1" stroke-width="2"/>
<g font-family="Arial, sans-serif">
<text x="56" y="81" font-size="31" fill="#18212b" font-weight="700">Current and Power Sign Conventions</text>
<line x1="56" y1="110" x2="904" y2="110" stroke="#d9dde1" stroke-width="2"/>
<text x="105" y="154" font-size="27" fill="#18212b" font-weight="700">Energy absorption</text>
<line x1="198" y1="186" x2="198" y2="271" stroke="#18212b" stroke-width="3"/>
<line x1="198" y1="363" x2="198" y2="419" stroke="#18212b" stroke-width="3"/>
<rect x="131" y="271" width="134" height="92" fill="#f7f8f9" stroke="#18212b" stroke-width="3"/>
<text x="158" y="326" font-size="22" fill="#18212b" font-weight="700">Element</text>
<circle cx="198" cy="250" r="5" fill="#18212b"/>
<circle cx="198" cy="404" r="5" fill="#18212b"/>
<text x="213" y="257" font-size="21" fill="#18212b">a (+)</text>
<text x="213" y="411" font-size="21" fill="#18212b">b (−)</text>
<line x1="164" y1="176" x2="164" y2="241" stroke="#1f5679" stroke-width="3" marker-end="url(#arrow)"/>
<text x="275" y="216" font-size="22" fill="#1f5679" font-weight="700">i = +0.20 A</text>
<text x="294" y="324" font-size="23" fill="#18212b">u = 6 V</text>
<text x="131" y="470" font-size="26" fill="#18212b" font-weight="700">p = +1.20 W</text>
<text x="556" y="154" font-size="27" fill="#18212b" font-weight="700">Energy delivery</text>
<line x1="649" y1="186" x2="649" y2="271" stroke="#18212b" stroke-width="3"/>
<line x1="649" y1="363" x2="649" y2="419" stroke="#18212b" stroke-width="3"/>
<rect x="582" y="271" width="134" height="92" fill="#f7f8f9" stroke="#18212b" stroke-width="3"/>
<text x="609" y="326" font-size="22" fill="#18212b" font-weight="700">Element</text>
<circle cx="649" cy="250" r="5" fill="#18212b"/>
<circle cx="649" cy="404" r="5" fill="#18212b"/>
<text x="664" y="257" font-size="21" fill="#18212b">a (+)</text>
<text x="664" y="411" font-size="21" fill="#18212b">b (−)</text>
<line x1="615" y1="241" x2="615" y2="176" stroke="#1f5679" stroke-width="3" marker-end="url(#arrow)"/>
<text x="726" y="216" font-size="22" fill="#1f5679" font-weight="700">i = −0.20 A</text>
<text x="745" y="324" font-size="23" fill="#18212b">u = 6 V</text>
<text x="582" y="470" font-size="26" fill="#18212b" font-weight="700">p = −1.20 W</text>
<line x1="480" y1="136" x2="480" y2="485" stroke="#d9dde1" stroke-width="2"/>
<text x="72" y="535" font-size="20" fill="#59636e">Reference for i: into the positive terminal. Arrows show actual current.</text>
</g>
</svg>
