<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Induction machines</title><desc>Original schematic teaching model; not design or test instructions.</desc><rect width="960" height="600" fill="#fff"/><g font-family="Arial,sans-serif" fill="#20242b"><text x="45" y="55" font-size="27" font-weight="bold">Induction machines</text><path d="M45 85H915" stroke="#cbd5e1"/><rect x="55" y="240" width="245" height="100" rx="10" fill="#dce9f5" stroke="#24649c" stroke-width="2"/><text x="177.5" y="298.0" text-anchor="middle" font-size="22">Air-gap power</text><text x="177" y="375" text-anchor="middle" font-size="24">5000 W</text><rect x="620" y="130" width="280" height="100" rx="10" fill="#e9c5a6" stroke="#24649c" stroke-width="2"/><text x="760.0" y="188.0" text-anchor="middle" font-size="22">Rotor loss</text><text x="760" y="255" text-anchor="middle" font-size="23">200 W (4%)</text><rect x="620" y="350" width="280" height="100" rx="10" fill="#dce9f5" stroke="#24649c" stroke-width="2"/><text x="760.0" y="408.0" text-anchor="middle" font-size="22">Converted power</text><text x="760" y="480" text-anchor="middle" font-size="23">4800 W (96%)</text><path d="M300 290H450V180H610m-12 -9l12 9 -12 9" stroke="#24649c" stroke-width="3" fill="none"/><path d="M450 290V400H610m-12 -9l12 9 -12 9" stroke="#24649c" stroke-width="3" fill="none"/><text x="450" y="320" text-anchor="middle" font-size="20">s = 0.04</text><text x="480" y="565" text-anchor="middle" font-size="18">Original schematic teaching model; not design or test instructions.</text></g></svg>