<circle cx="152" cy="195" r="5" fill="#18212b"/>
<circle cx="480" cy="195" r="5" fill="#18212b"/>
<circle cx="788" cy="195" r="5" fill="#18212b"/>
<circle cx="480" cy="473" r="5" fill="#18212b"/>
<circle cx="788" cy="473" r="5" fill="#18212b"/>
<text x="126" y="173" font-size="25" fill="#18212b" font-weight="700">S</text>
<text x="465" y="173" font-size="25" fill="#18212b" font-weight="700">A</text>
<text x="778" y="173" font-size="25" fill="#18212b" font-weight="700">B</text>
<text x="245" y="240" font-size="22" fill="#18212b">R₁ = 1 kΩ</text>
