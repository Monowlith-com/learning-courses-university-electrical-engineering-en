<line x1="152" y1="195" x2="152" y2="308" stroke="#18212b" stroke-width="3"/>
<line x1="152" y1="378" x2="152" y2="473" stroke="#18212b" stroke-width="3"/>
<line x1="152" y1="473" x2="788" y2="473" stroke="#18212b" stroke-width="3"/>
<circle cx="152" cy="343" r="35" fill="#fff" stroke="#18212b" stroke-width="3"/>
<text x="144" y="337" font-size="24" fill="#18212b">+</text>
<text x="144" y="361" font-size="24" fill="#18212b">−</text>
<text x="53" y="352" font-size="24" fill="#18212b" font-weight="700">14 V</text>
<line x1="480" y1="195" x2="480" y2="307" stroke="#18212b" stroke-width="3"/>
<rect x="462" y="307" width="36" height="78" fill="#fff" stroke="#18212b" stroke-width="3"/>
