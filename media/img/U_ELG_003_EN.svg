<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">Node Potentials in a Branched Network</title>
<desc id="desc">R1 connects source node S at fourteen volts to A. R3 connects A and B. R2 connects A, and R4 connects B, to the common reference node. Arrows show calculated branch currents.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1f5679"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<rect x="18" y="18" width="924" height="564" rx="18" fill="#fff" stroke="#d9dde1" stroke-width="2"/>
<g font-family="Arial, sans-serif">
<text x="56" y="81" font-size="31" fill="#18212b" font-weight="700">Node Potentials in a Branched Network</text>
<line x1="56" y1="110" x2="904" y2="110" stroke="#d9dde1" stroke-width="2"/>
<line x1="152" y1="195" x2="251" y2="195" stroke="#18212b" stroke-width="3"/>
<rect x="251" y="178" width="100" height="34" fill="#fff" stroke="#18212b" stroke-width="3"/>
