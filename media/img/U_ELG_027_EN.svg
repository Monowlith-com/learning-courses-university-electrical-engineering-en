<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc"><title id="title">Single-Line Diagram of a Three-Node Grid</title><desc id="desc">A three-node grid with an infeed at node 1, two load nodes and three lines.</desc><rect width="960" height="600" fill="#fff"/><rect x="18" y="18" width="924" height="564" rx="17" fill="#fff" stroke="#dbe1e6" stroke-width="2"/><g font-family="Arial, sans-serif"><text x="56" y="79" font-size="32" fill="#1e2a31" text-anchor="start" font-weight="normal">Single-Line Diagram of a Three-Node Grid</text><line x1="56" y1="110" x2="904" y2="110" stroke="#dbe1e6" stroke-width="2"/><text x="480" y="151" font-size="21" fill="#1e2a31" text-anchor="middle" font-weight="normal">Balanced three-phase model · three line branches</text><line x1="480" y1="258" x2="215" y2="405" stroke="#285a78" stroke-width="5"/><line x1="480" y1="258" x2="745" y2="405" stroke="#285a78" stroke-width="5"/><line x1="215" y1="405" x2="745" y2="405" stroke="#285a78" stroke-width="5"/><circle cx="480" cy="258" r="24" fill="#285a78" stroke="#285a78" stroke-width="2"/><text x="480" y="266" font-size="23" fill="white" text-anchor="middle" font-weight="bold">1</text><circle cx="215" cy="405" r="24" fill="#285a78" stroke="#285a78" stroke-width="2"/><text x="215" y="413" font-size="23" fill="white" text-anchor="middle" font-weight="bold">2</text><circle cx="745" cy="405" r="24" fill="#285a78" stroke="#285a78" stroke-width="2"/><text x="745" y="413" font-size="23" fill="white" text-anchor="middle" font-weight="bold">3</text><rect x="390" y="170" width="180" height="45" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="480" y="200" font-size="22" fill="#285a78" text-anchor="middle" font-weight="normal">Infeed</text><line x1="480" y1="215" x2="480" y2="231" stroke="#285a78" stroke-width="3"/><polygon points="480.00,231.00 474.25,220.47 485.75,220.47" fill="#285a78"/><text x="300" y="316" font-size="20" fill="#285a78" text-anchor="middle" font-weight="normal">1–2</text><text x="665" y="316" font-size="20" fill="#285a78" text-anchor="middle" font-weight="normal">1–3</text><text x="480" y="392" font-size="20" fill="#285a78" text-anchor="middle" font-weight="normal">2–3</text><line x1="215" y1="431" x2="215" y2="475" stroke="#b66a37" stroke-width="3"/><polygon points="215.00,475.00 209.25,464.47 220.75,464.47" fill="#b66a37"/><rect x="122" y="478" width="186" height="46" rx="8" fill="#fbf2eb" stroke="#b66a37" stroke-width="2"/><text x="215" y="508" font-size="20" fill="#b66a37" text-anchor="middle" font-weight="normal">Load area 2</text><line x1="745" y1="431" x2="745" y2="475" stroke="#b66a37" stroke-width="3"/><polygon points="745.00,475.00 739.25,464.47 750.75,464.47" fill="#b66a37"/><rect x="652" y="478" width="186" height="46" rx="8" fill="#fbf2eb" stroke="#b66a37" stroke-width="2"/><text x="745" y="508" font-size="20" fill="#b66a37" text-anchor="middle" font-weight="normal">Load area 3</text><text x="480" y="558" font-size="18" fill="#1e2a31" text-anchor="middle" font-weight="normal">A closed ring provides alternative paths, but no capacity guarantee.</text></g></svg>
