<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc"><title id="title">Storage: Energy and Power Limits</title><desc id="desc">Energy flow at the AC node with charging and discharging efficiencies, state-of-charge window and loss paths.</desc><rect width="960" height="600" fill="#fff"/><rect x="18" y="18" width="924" height="564" rx="17" fill="#fff" stroke="#dbe1e6" stroke-width="2"/><g font-family="Arial, sans-serif"><text x="56" y="79" font-size="32" fill="#1e2a31" text-anchor="start" font-weight="normal">Storage: Energy and Power Limits</text><line x1="56" y1="110" x2="904" y2="110" stroke="#dbe1e6" stroke-width="2"/><text x="480" y="151" font-size="22" fill="#1e2a31" text-anchor="middle" font-weight="normal">AC connection · positive charging and discharging power</text><rect x="70" y="220" width="220" height="112" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="180" y="263" font-size="24" fill="#285a78" text-anchor="middle" font-weight="normal">AC node</text><text x="180" y="295" font-size="18" fill="#1e2a31" text-anchor="middle" font-weight="normal">PV / load / grid</text><rect x="540" y="185" width="330" height="196" rx="8" fill="#eaf4ef" stroke="#397f65" stroke-width="2"/><text x="705" y="225" font-size="24" fill="#397f65" text-anchor="middle" font-weight="normal">Internal energy e</text><rect x="585" y="255" width="240" height="42" rx="4" fill="white" stroke="#397f65" stroke-width="2"/><rect x="609" y="255" width="192" height="42" fill="#397f65" opacity=".35"/><line x1="609" y1="248" x2="609" y2="305" stroke="#397f65" stroke-width="2"/><line x1="801" y1="248" x2="801" y2="305" stroke="#397f65" stroke-width="2"/><text x="609" y="329" font-size="19" fill="#397f65" text-anchor="middle" font-weight="normal">10 %</text><text x="801" y="329" font-size="19" fill="#397f65" text-anchor="middle" font-weight="normal">90 %</text><text x="705" y="358" font-size="19" fill="#1e2a31" text-anchor="middle" font-weight="normal">permissible charge window</text><line x1="291" y1="242" x2="540" y2="242" stroke="#285a78" stroke-width="4"/><polygon points="540.00,242.00 529.47,247.75 529.47,236.25" fill="#285a78"/><text x="415" y="224" font-size="20" fill="#285a78" text-anchor="middle" font-weight="normal">Charge: ηc · c</text><line x1="540" y1="310" x2="291" y2="310" stroke="#397f65" stroke-width="4"/><polygon points="291.00,310.00 301.53,304.25 301.53,315.75" fill="#397f65"/><text x="415" y="344" font-size="20" fill="#397f65" text-anchor="middle" font-weight="normal">Output: d</text><line x1="390" y1="242" x2="390" y2="400" stroke="#b66a37" stroke-width="2"/><polygon points="390.00,400.00 384.25,389.47 395.75,389.47" fill="#b66a37"/><line x1="465" y1="310" x2="465" y2="400" stroke="#b66a37" stroke-width="2"/><polygon points="465.00,400.00 459.25,389.47 470.75,389.47" fill="#b66a37"/><rect x="285" y="402" width="285" height="65" rx="8" fill="#fbf2eb" stroke="#b66a37" stroke-width="2"/><text x="427" y="431" font-size="21" fill="#b66a37" text-anchor="middle" font-weight="normal">Losses</text><text x="427" y="454" font-size="18" fill="#b66a37" text-anchor="middle" font-weight="normal">(1−ηc)c + (1/ηd−1)d</text><text x="480" y="536" font-size="25" fill="#1e2a31" text-anchor="middle" font-weight="normal">Δe = (ηc · c − d / ηd) · Δt</text></g></svg>
