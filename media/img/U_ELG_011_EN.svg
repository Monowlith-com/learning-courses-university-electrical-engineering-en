<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Electric Field Between Parallel Plates</title>
  <desc id="desc">The left plate carries positive charge and the right plate negative charge. Field arrows point uniformly to the right. The potential decreases to the right.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#135477"/>
    </marker>
    <marker id="arrowGray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#596673"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#fff"/>
  <rect x="18" y="18" width="924" height="564" rx="18" fill="white" stroke="#dde2e6" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203243">
    <text x="54" y="74" font-size="32" font-weight="700">Electric Field Between Parallel Plates</text>
    <path d="M54 99 H906" stroke="#dde2e6" stroke-width="2"/>
    <text x="209" y="145" text-anchor="middle" font-size="23">Positive plate</text>
    <text x="751" y="145" text-anchor="middle" font-size="23">Negative plate</text>
    <rect x="194" y="171" width="30" height="251" rx="3" fill="#f5dfdc" stroke="#97433c" stroke-width="2"/>
    <rect x="736" y="171" width="30" height="251" rx="3" fill="#dce9f3" stroke="#315978" stroke-width="2"/>
    <g font-size="21" font-weight="700" text-anchor="middle">
      <text x="209" y="214" fill="#89372e">+</text><text x="209" y="292" fill="#89372e">+</text><text x="209" y="370" fill="#89372e">+</text>
      <text x="751" y="214" fill="#234e6d">−</text><text x="751" y="292" fill="#234e6d">−</text><text x="751" y="370" fill="#234e6d">−</text>
    </g>
    <g stroke="#135477" stroke-width="4" marker-end="url(#arrowBlue)">
      <path d="M265 235 H694"/><path d="M265 300 H694"/><path d="M265 365 H694"/>
    </g>
    <text x="480" y="202" text-anchor="middle" font-size="23" fill="#135477" font-weight="700">Electric field E</text>
    <path d="M229 447 H731" stroke="#596673" stroke-width="2.5" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
    <text x="480" y="480" text-anchor="middle" font-size="22">Plate separation d</text>
    <path d="M54 514 H906" stroke="#dde2e6" stroke-width="2"/>
    <text x="480" y="550" text-anchor="middle" font-size="21">Potential decreases in the field direction.</text>
  </g>
</svg>
