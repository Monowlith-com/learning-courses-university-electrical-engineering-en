<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Signal Paths in a Closed Loop</title>
<desc id="desc">The reference minus the measured value gives the control error. The controller drives the plant. The added output disturbance also affects the measuring element and thus the feedback.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#18212b"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<rect x="18" y="18" width="924" height="564" rx="18" fill="#fff" stroke="#d9dee3" stroke-width="2"/>
<g font-family="Arial, sans-serif">
<text x="54" y="78" font-size="33" fill="#18212b" font-weight="700" text-anchor="start">Signal Paths in a Closed Loop</text>
<path d="M54 106 H906" fill="none" stroke="#d9dee3" stroke-width="2"/>
<text x="62" y="222" font-size="21" fill="#225c88" font-weight="700" text-anchor="start">Reference r</text>
