<circle cx="752" cy="261" r="24" fill="#fff" stroke="#18212b" stroke-width="2.5"/>
<text x="747" y="269" font-size="21" fill="#18212b" font-weight="400" text-anchor="start">Σ</text>
<text x="719" y="248" font-size="21" fill="#18212b" font-weight="400" text-anchor="start">+</text>
<path d="M752 176 V233" fill="none" stroke="#18212b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="716" y="158" font-size="20" fill="#23675f" font-weight="700" text-anchor="start">Disturbance d</text>
<text x="766" y="225" font-size="21" fill="#18212b" font-weight="400" text-anchor="start">+</text>
<path d="M776 261 H892" fill="none" stroke="#18212b" stroke-width="2.5" marker-end="url(#arrow)"/>
