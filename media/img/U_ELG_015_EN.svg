<text x="194" y="269" font-size="21" fill="#18212b" font-weight="400" text-anchor="start">Σ</text>
<text x="163" y="250" font-size="21" fill="#18212b" font-weight="400" text-anchor="start">+</text>
<text x="175" y="309" font-size="25" fill="#18212b" font-weight="400" text-anchor="start">−</text>
<path d="M223 261 H301" fill="none" stroke="#18212b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="251" y="242" font-size="19" fill="#59636e" font-weight="400" text-anchor="start">e</text>
<rect x="304" y="224" width="147" height="74" rx="12" fill="#f6f9fb" stroke="#18212b" stroke-width="2"/>
<text x="377.5" y="269" font-size="24" fill="#18212b" font-weight="700" text-anchor="middle">Controller C</text>
<path d="M451 261 H520" fill="none" stroke="#18212b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="477" y="242" font-size="19" fill="#59636e" font-weight="400" text-anchor="start">u</text>
<rect x="523" y="224" width="147" height="74" rx="12" fill="#f6f9fb" stroke="#18212b" stroke-width="2"/>
<text x="596.5" y="269" font-size="24" fill="#18212b" font-weight="700" text-anchor="middle">Plant G</text>
