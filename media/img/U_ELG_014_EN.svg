<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Convolution by Superposition</title>
<desc id="desc">First contribution: 1, 2, 1, 0 volts. Second contribution: 0, 0.5, 1, 0.5 volts. Sum: 1, 2.5, 2, 0.5 volts.</desc>
<rect width="960" height="600" fill="#fff"/>
<rect x="14" y="14" width="932" height="572" rx="14" fill="none" stroke="#dce3e8" stroke-width="2"/>
<g font-family="system-ui,DejaVu Sans,sans-serif">
<text x="55" y="66" font-size="31" fill="#1f3041" text-anchor="start" font-weight="700">Convolution by Superposition</text>
<text x="55" y="101" font-size="19" fill="#415465" text-anchor="start" font-weight="400">Two contributions from shifted impulse responses · values in volts</text>
<text x="55" y="201" font-size="23" fill="#1f3041" text-anchor="start" font-weight="700">First contribution</text>
<text x="55" y="231" font-size="18" fill="#415465" text-anchor="start" font-weight="400">Input sample 4 V</text>
<line x1="327" y1="244" x2="870" y2="244" stroke="#dde5eb" stroke-width="2"/>
<line x1="382" y1="244" x2="382" y2="212" stroke="#176497" stroke-width="3"/>
<circle cx="382.000" cy="212.000" r="5" fill="#176497"/>
<text x="382" y="199" font-size="19" fill="#176497" text-anchor="middle" font-weight="600">1</text>
<line x1="528" y1="244" x2="528" y2="180" stroke="#176497" stroke-width="3"/>
<circle cx="528.000" cy="180.000" r="5" fill="#176497"/>
<text x="528" y="167" font-size="19" fill="#176497" text-anchor="middle" font-weight="600">2</text>
<line x1="674" y1="244" x2="674" y2="212" stroke="#176497" stroke-width="3"/>
<circle cx="674.000" cy="212.000" r="5" fill="#176497"/>
<text x="674" y="199" font-size="19" fill="#176497" text-anchor="middle" font-weight="600">1</text>
<circle cx="820.000" cy="244.000" r="5" fill="#176497"/>
<text x="820" y="231" font-size="19" fill="#176497" text-anchor="middle" font-weight="600">0</text>
<text x="55" y="330" font-size="23" fill="#1f3041" text-anchor="start" font-weight="700">Second contribution</text>
<text x="55" y="360" font-size="18" fill="#415465" text-anchor="start" font-weight="400">Input sample 2 V</text>
<line x1="327" y1="373" x2="870" y2="373" stroke="#dde5eb" stroke-width="2"/>
<circle cx="382.000" cy="373.000" r="5" fill="#a34a21"/>
<text x="382" y="360" font-size="19" fill="#a34a21" text-anchor="middle" font-weight="600">0</text>
<line x1="528" y1="373" x2="528" y2="357.0" stroke="#a34a21" stroke-width="3"/>
<circle cx="528.000" cy="357.000" r="5" fill="#a34a21"/>
<text x="528" y="344.0" font-size="19" fill="#a34a21" text-anchor="middle" font-weight="600">0.5</text>
<line x1="674" y1="373" x2="674" y2="341" stroke="#a34a21" stroke-width="3"/>
<circle cx="674.000" cy="341.000" r="5" fill="#a34a21"/>
<text x="674" y="328" font-size="19" fill="#a34a21" text-anchor="middle" font-weight="600">1</text>
<line x1="820" y1="373" x2="820" y2="357.0" stroke="#a34a21" stroke-width="3"/>
<circle cx="820.000" cy="357.000" r="5" fill="#a34a21"/>
<text x="820" y="344.0" font-size="19" fill="#a34a21" text-anchor="middle" font-weight="600">0.5</text>
<text x="55" y="459" font-size="23" fill="#1f3041" text-anchor="start" font-weight="700">Output</text>
<text x="55" y="489" font-size="18" fill="#415465" text-anchor="start" font-weight="400">Sum of contributions</text>
<line x1="327" y1="502" x2="870" y2="502" stroke="#dde5eb" stroke-width="2"/>
<line x1="382" y1="502" x2="382" y2="470" stroke="#1f3041" stroke-width="3"/>
<circle cx="382.000" cy="470.000" r="5" fill="#1f3041"/>
<text x="382" y="457" font-size="19" fill="#1f3041" text-anchor="middle" font-weight="600">1</text>
<line x1="528" y1="502" x2="528" y2="422.0" stroke="#1f3041" stroke-width="3"/>
<circle cx="528.000" cy="422.000" r="5" fill="#1f3041"/>
<text x="528" y="409.0" font-size="19" fill="#1f3041" text-anchor="middle" font-weight="600">2.5</text>
<line x1="674" y1="502" x2="674" y2="438" stroke="#1f3041" stroke-width="3"/>
<circle cx="674.000" cy="438.000" r="5" fill="#1f3041"/>
<text x="674" y="425" font-size="19" fill="#1f3041" text-anchor="middle" font-weight="600">2</text>
<line x1="820" y1="502" x2="820" y2="486.0" stroke="#1f3041" stroke-width="3"/>
<circle cx="820.000" cy="486.000" r="5" fill="#1f3041"/>
<text x="820" y="473.0" font-size="19" fill="#1f3041" text-anchor="middle" font-weight="600">0.5</text>
<text x="382" y="537" font-size="19" fill="#415465" text-anchor="middle" font-weight="400">0</text>
<text x="528" y="537" font-size="19" fill="#415465" text-anchor="middle" font-weight="400">1</text>
<text x="674" y="537" font-size="19" fill="#415465" text-anchor="middle" font-weight="400">2</text>
<text x="820" y="537" font-size="19" fill="#415465" text-anchor="middle" font-weight="400">3</text>
<text x="872" y="537" font-size="20" fill="#415465" text-anchor="start" font-weight="400">n</text>
</g></svg>
