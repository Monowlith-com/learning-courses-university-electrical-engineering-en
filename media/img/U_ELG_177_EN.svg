<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Force, torque and motion</title><desc>Original teaching model</desc><rect width="960" height="600" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#23486b"/></marker></defs><g font-family="Arial,sans-serif" fill="#20242b"><text x="45" y="53" font-size="28" text-anchor="start" fill="#20242b" font-weight="bold">Force, torque and motion</text><path d="M45 80L915 80" stroke="#cbd5e1" stroke-width="1" fill="none"/><circle cx="260" cy="290" r="125" fill="#e8f2fb" stroke="#23486b" stroke-width="4"/><circle cx="260" cy="290" r="9" fill="#23486b"/><path d="M260 290L260 165" stroke="#23486b" stroke-width="3" fill="none"/><path d="M260 165L425 165" stroke="#23486b" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="360" y="144" font-size="25" text-anchor="middle" fill="#20242b">Fₜ</text><text x="238" y="232" font-size="23" text-anchor="middle" fill="#20242b">r</text><text x="260" y="326" font-size="26" text-anchor="middle" fill="#20242b">J</text><path d="M365 370 A130 130 0 0 1 145 350" fill="none" stroke="#23486b" stroke-width="4" marker-end="url(#a)"/><text x="258" y="455" font-size="27" text-anchor="middle" fill="#20242b">M = r Fₜ</text><text x="258" y="485" font-size="24" text-anchor="middle" fill="#20242b">ω, α</text><rect x="510" y="130" width="365" height="100" rx="10" fill="#e8f2fb" stroke="#23486b" stroke-width="2"/><text x="692.5" y="166" font-size="23" text-anchor="middle" fill="#20242b" font-weight="bold">Mₘ = 8 N·m</text><text x="692.5" y="198" font-size="19" text-anchor="middle" fill="#20242b">J = 0.2 kg·m²</text><rect x="510" y="270" width="365" height="100" rx="10" fill="#e8f2fb" stroke="#23486b" stroke-width="2"/><text x="692.5" y="306" font-size="23" text-anchor="middle" fill="#20242b" font-weight="bold">Mₗ = 2 N·m</text><text x="692.5" y="338" font-size="19" text-anchor="middle" fill="#20242b">α = 30 rad/s²</text><path d="M692 230L692 270" stroke="#23486b" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="693" y="425" font-size="24" text-anchor="middle" fill="#20242b">ω(2 s) = 60 rad/s</text><text x="693" y="475" font-size="24" text-anchor="middle" fill="#20242b">E = 360 J</text><text x="480" y="557" font-size="21" text-anchor="middle" fill="#20242b">Tangential force and torque balance</text></g></svg>