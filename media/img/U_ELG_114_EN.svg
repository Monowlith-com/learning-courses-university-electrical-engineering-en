<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc"><title id="title">RC Circuit: Adding Voltage Phasors</title><desc id="desc">At the RC circuit cutoff frequency, phasors (1+j) V and (1−j) V add to 2 V.</desc><rect width="960" height="600" fill="white"/><rect x="18" y="18" width="924" height="564" rx="18" fill="white" stroke="#dce2e8" stroke-width="2"/><g font-family="Arial, sans-serif">
<text x="55.00" y="68.00" font-size="30" fill="#18212b" text-anchor="start" font-weight="700">RC Circuit: Adding Voltage Phasors</text>
<text x="55.00" y="96.00" font-size="18" fill="#637383" text-anchor="start" font-weight="400">RMS phasors · ω = 10 000 rad/s · R = 100 Ω, C = 1 µF</text>
