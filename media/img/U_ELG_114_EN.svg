<text x="420.00" y="480.00" font-size="21" fill="#237b66" text-anchor="start" font-weight="700">U_C = 1 − j</text>
<text x="583.00" y="358.00" font-size="21" fill="#b35c22" text-anchor="start" font-weight="700">U = 2 V</text>
