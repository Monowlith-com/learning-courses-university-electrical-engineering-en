<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Normal Wave Incidence at a Material Boundary</title>
  <desc id="desc">A wave travels from air into the dielectric. At the boundary a portion is reflected with an electric amplitude factor of minus one third. A wave continues into the dielectric with an amplitude factor of two thirds.</desc>
  <defs>
    <marker id="blueHead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#135477"/>
    </marker>
    <marker id="rustHead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#854338"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#fff"/>
  <rect x="18" y="18" width="924" height="564" rx="18" fill="white" stroke="#dde2e6" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#203243">
    <text x="54" y="74" font-size="31" font-weight="700">Normal Wave Incidence at a Material Boundary</text>
    <path d="M54 99 H906" stroke="#dde2e6" stroke-width="2"/>
    <rect x="515" y="131" width="378" height="310" fill="#f2f6f8"/>
    <path d="M515 130 V449" stroke="#516675" stroke-width="3"/>
    <text x="89" y="171" font-size="25" font-weight="700">Air</text>
    <text x="89" y="205" font-size="22">Wave impedance ≈ 377 Ω</text>
    <text x="554" y="171" font-size="25" font-weight="700">Ideal dielectric</text>
    <text x="554" y="205" font-size="22">Wave impedance ≈ 188.5 Ω</text>
    <text x="89" y="269" font-size="22" fill="#135477">Incident wave</text>
    <path d="M91 303 H494" stroke="#135477" stroke-width="4" marker-end="url(#blueHead)"/>
    <text x="554" y="269" font-size="22" fill="#135477">Transmitted wave · 2/3</text>
    <path d="M535 303 H868" stroke="#135477" stroke-width="4" marker-end="url(#blueHead)"/>
    <text x="103" y="369" font-size="22" fill="#854338">Reflected wave · −1/3</text>
    <path d="M495 402 H99" stroke="#854338" stroke-width="4" marker-end="url(#rustHead)"/>
    <text x="515" y="485" text-anchor="middle" font-size="21">Interface</text>
    <path d="M54 512 H906" stroke="#dde2e6" stroke-width="2"/>
    <text x="480" y="550" text-anchor="middle" font-size="20">The factors refer to the electric field amplitude of the incident wave.</text>
  </g>
</svg>
