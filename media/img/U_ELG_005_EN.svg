<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">Two Nodes, Two Current Balances</title><desc id="desc">Nodes A and B are connected by a conductance of 1 mS. Their conductances to the common reference are 1 and 2 mS respectively. Ideal sources inject 4 and 1 mA.</desc>
