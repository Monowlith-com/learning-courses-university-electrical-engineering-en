<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc"><title id="title">Comparison of Three Storage Pathways</title><desc id="desc">Illustrative electrical energy balance for 100 kWh input in each case and the selected round-trip efficiencies.</desc><rect width="960" height="600" fill="#fff"/><rect x="18" y="18" width="924" height="564" rx="17" fill="#fff" stroke="#dbe1e6" stroke-width="2"/><g font-family="Arial, sans-serif"><text x="56" y="79" font-size="32" fill="#1e2a31" text-anchor="start" font-weight="normal">Comparison of Three Storage Pathways</text><line x1="56" y1="110" x2="904" y2="110" stroke="#dbe1e6" stroke-width="2"/><text x="56" y="150" font-size="21" fill="#1e2a31" text-anchor="start" font-weight="normal">100 kWh electrical input each; illustrative model values</text><text x="56" y="225" font-size="22" fill="#1e2a31" text-anchor="start" font-weight="bold">Battery</text><text x="56" y="250" font-size="18" fill="#1e2a31" text-anchor="start" font-weight="normal">0.95 × 0.95</text><rect x="280" y="203" width="530" height="44" rx="3" fill="#fbf2eb" stroke="#b66a37" stroke-width="2"/><rect x="280" y="203" width="478.325" height="44" fill="#397f65" rx="3"/><text x="826" y="232" font-size="18" fill="#397f65" text-anchor="start" font-weight="normal">90.25 %</text><text x="56" y="326" font-size="22" fill="#1e2a31" text-anchor="start" font-weight="bold">Pumped storage</text><text x="56" y="351" font-size="18" fill="#1e2a31" text-anchor="start" font-weight="normal">0.90 × 0.90</text><rect x="280" y="304" width="530" height="44" rx="3" fill="#fbf2eb" stroke="#b66a37" stroke-width="2"/><rect x="280" y="304" width="429.3" height="44" fill="#397f65" rx="3"/><text x="826" y="333" font-size="18" fill="#397f65" text-anchor="start" font-weight="normal">81 %</text><text x="56" y="427" font-size="22" fill="#1e2a31" text-anchor="start" font-weight="bold">Hydrogen</text><text x="56" y="452" font-size="18" fill="#1e2a31" text-anchor="start" font-weight="normal">0.70 × 0.90 × 0.50</text><rect x="280" y="405" width="530" height="44" rx="3" fill="#fbf2eb" stroke="#b66a37" stroke-width="2"/><rect x="280" y="405" width="166.95" height="44" fill="#397f65" rx="3"/><text x="826" y="434" font-size="18" fill="#397f65" text-anchor="start" font-weight="normal">31.5 %</text><rect x="280" y="510" width="24" height="20" rx="2" fill="#397f65" stroke="#397f65" stroke-width="2"/><text x="315" y="526" font-size="19" fill="#1e2a31" text-anchor="start" font-weight="normal">Returned</text><rect x="480" y="510" width="24" height="20" rx="2" fill="#fbf2eb" stroke="#b66a37" stroke-width="2"/><text x="515" y="526" font-size="19" fill="#1e2a31" text-anchor="start" font-weight="normal">Not recovered as electricity</text><text x="480" y="561" font-size="18" fill="#1e2a31" text-anchor="middle" font-weight="normal">Identical initial and final state · no standing losses</text></g></svg>
