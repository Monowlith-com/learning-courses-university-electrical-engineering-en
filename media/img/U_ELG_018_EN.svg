<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Single-Line Diagram of an Electricity Supply</title>
  <desc id="desc">Feed-in, conversion, transmission, distribution and load are connected in sequence. The marked powers are 1.50 kilowatts before conversion, 1.40 kilowatts before distribution and 1.20 kilowatts before the load.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path fill="#1d5574" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <rect x="20" y="20" width="920" height="560" rx="20" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <g font-family="sans-serif" fill="#182020">
    <text x="480" y="81" text-anchor="middle" font-size="30" font-weight="700">Single-Line Diagram of an Electricity Supply</text>
    <text x="480" y="119" text-anchor="middle" font-size="19" fill="#495565">Active power in the modelled load condition</text>
    <path d="M60 146H900" fill="none" stroke="#e2e5e9" stroke-width="2"/>
    <path d="M104 281H870" fill="none" stroke="#1d5574" stroke-width="3" marker-end="url(#arrow)"/>
    <g fill="#f6fbfe" stroke="#275770" stroke-width="3">
      <rect x="56" y="248" width="150" height="66" rx="8"/>
      <rect x="231" y="248" width="150" height="66" rx="8"/>
      <rect x="406" y="248" width="150" height="66" rx="8"/>
      <rect x="581" y="248" width="150" height="66" rx="8"/>
      <rect x="756" y="248" width="130" height="66" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="20" font-weight="700">
      <text x="131" y="288">Feed-in</text>
      <text x="306" y="288">Conversion</text>
      <text x="481" y="288">Transmission</text>
      <text x="656" y="288">Distribution</text>
      <text x="821" y="288">Load</text>
    </g>
    <g fill="#1d5574" font-size="22" text-anchor="middle">
      <text x="218" y="201">1.50 kW</text>
      <text x="568" y="201">1.40 kW</text>
      <text x="743" y="201">1.20 kW</text>
      <circle cx="218" cy="281" r="4"/><circle cx="568" cy="281" r="4"/><circle cx="743" cy="281" r="4"/>
    </g>
    <path d="M218 212V272M568 212V272M743 212V272" stroke="#1d5574" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M230 338v10h326v-10M580 338v10h152v-10" fill="none" stroke="#92613a" stroke-width="2"/>
    <g fill="#7c461d" font-size="21" text-anchor="middle">
      <text x="393" y="387">0.10 kW loss</text>
      <text x="656" y="387">0.20 kW loss</text>
    </g>
    <path d="M60 457H900" fill="none" stroke="#e2e5e9" stroke-width="2"/>
    <text x="480" y="502" fill="#495565" text-anchor="middle" font-size="19">Each connection may represent three balanced line conductors.</text>
  </g>
</svg>
