<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Aliasing under Uniform Sampling</title>
<desc id="desc">Cosines at 100 and 900 hertz produce the same sample points at one-millisecond intervals, although their curves differ between the points.</desc>
<rect width="960" height="600" fill="#fff"/>
