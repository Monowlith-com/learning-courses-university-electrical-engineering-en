<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc"><title id="title">Selective Disconnection in a Radial Grid</title><desc id="desc">Radial supply with an upstream backup circuit breaker and two outgoing feeders, of which only the faulty one is disconnected by its local breaker.</desc><rect width="960" height="600" fill="#fff"/><rect x="18" y="18" width="924" height="564" rx="17" fill="#fff" stroke="#dbe1e6" stroke-width="2"/><g font-family="Arial, sans-serif"><text x="56" y="79" font-size="32" fill="#1e2a31" text-anchor="start" font-weight="normal">Selective Disconnection in a Radial Grid</text><line x1="56" y1="110" x2="904" y2="110" stroke="#dbe1e6" stroke-width="2"/><text x="480" y="150" font-size="21" fill="#1e2a31" text-anchor="middle" font-weight="normal">Conceptual diagram · not actual protection settings</text><rect x="390" y="178" width="180" height="43" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="480" y="208" font-size="22" fill="#285a78" text-anchor="middle" font-weight="normal">Infeed</text><line x1="480" y1="222" x2="480" y2="270" stroke="#285a78" stroke-width="4"/><rect x="455" y="270" width="50" height="38" rx="3" fill="white" stroke="#285a78" stroke-width="2"/><line x1="480" y1="270" x2="480" y2="308" stroke="#285a78" stroke-width="4"/><text x="525" y="296" font-size="21" fill="#285a78" text-anchor="start" font-weight="normal">Backup</text><line x1="480" y1="308" x2="480" y2="338" stroke="#285a78" stroke-width="4"/><line x1="240" y1="338" x2="720" y2="338" stroke="#285a78" stroke-width="4"/><line x1="240" y1="338" x2="240" y2="376" stroke="#285a78" stroke-width="4"/><line x1="720" y1="338" x2="720" y2="376" stroke="#285a78" stroke-width="4"/><rect x="215" y="376" width="50" height="38" rx="3" fill="white" stroke="#397f65" stroke-width="2"/><rect x="695" y="376" width="50" height="38" rx="3" fill="white" stroke="#ad4842" stroke-width="2"/><line x1="240" y1="376" x2="240" y2="414" stroke="#397f65" stroke-width="4"/><line x1="720" y1="414" x2="738" y2="386" stroke="#ad4842" stroke-width="4"/><text x="192" y="400" font-size="20" fill="#397f65" text-anchor="end" font-weight="normal">on</text><text x="758" y="400" font-size="20" fill="#ad4842" text-anchor="start" font-weight="normal">off</text><line x1="240" y1="414" x2="240" y2="470" stroke="#397f65" stroke-width="4"/><line x1="720" y1="414" x2="720" y2="470" stroke="#ad4842" stroke-width="3" stroke-dasharray="6 6"/><rect x="133" y="470" width="214" height="56" rx="8" fill="#eaf4ef" stroke="#397f65" stroke-width="2"/><rect x="613" y="470" width="214" height="56" rx="8" fill="#fcefee" stroke="#ad4842" stroke-width="2"/><text x="240" y="505" font-size="21" fill="#397f65" text-anchor="middle" font-weight="normal">Healthy feeder</text><text x="720" y="505" font-size="21" fill="#ad4842" text-anchor="middle" font-weight="normal">Faulty feeder</text><text x="480" y="557" font-size="20" fill="#1e2a31" text-anchor="middle" font-weight="normal">Local disconnection isolates only the affected branch.</text></g></svg>
