<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc"><title id="title">Three Routes to Electrical Energy</title><desc id="desc">Heat, wind and solar radiation are converted into electrical power through different conversion stages.</desc><rect width="960" height="600" fill="#fff"/><rect x="18" y="18" width="924" height="564" rx="17" fill="#fff" stroke="#dbe1e6" stroke-width="2"/><g font-family="Arial, sans-serif"><text x="56" y="79" font-size="32" fill="#1e2a31" text-anchor="start" font-weight="normal">Three Routes to Electrical Energy</text><line x1="56" y1="110" x2="904" y2="110" stroke="#dbe1e6" stroke-width="2"/><text x="56" y="222" font-size="22" fill="#1e2a31" text-anchor="start" font-weight="bold">Heat</text><rect x="170" y="187" width="160" height="60" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="250" y="224" font-size="18" fill="#285a78" text-anchor="middle" font-weight="normal">Heat source</text><line x1="330" y1="217" x2="359" y2="217" stroke="#285a78" stroke-width="3"/><polygon points="359.00,217.00 348.47,222.75 348.47,211.25" fill="#285a78"/><rect x="360" y="187" width="160" height="60" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="440" y="224" font-size="18" fill="#285a78" text-anchor="middle" font-weight="normal">Thermal cycle</text><line x1="520" y1="217" x2="549" y2="217" stroke="#285a78" stroke-width="3"/><polygon points="549.00,217.00 538.47,222.75 538.47,211.25" fill="#285a78"/><rect x="550" y="187" width="160" height="60" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="630" y="224" font-size="18" fill="#285a78" text-anchor="middle" font-weight="normal">Generator</text><line x1="710" y1="217" x2="750" y2="217" stroke="#397f65" stroke-width="3"/><polygon points="750.00,217.00 739.47,222.75 739.47,211.25" fill="#397f65"/><rect x="750" y="187" width="145" height="60" rx="8" fill="#eaf4ef" stroke="#397f65" stroke-width="2"/><text x="822" y="224" font-size="18" fill="#397f65" text-anchor="middle" font-weight="normal">AC power</text><text x="56" y="344" font-size="22" fill="#1e2a31" text-anchor="start" font-weight="bold">Wind</text><rect x="170" y="309" width="160" height="60" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="250" y="346" font-size="18" fill="#285a78" text-anchor="middle" font-weight="normal">Airflow</text><line x1="330" y1="339" x2="359" y2="339" stroke="#285a78" stroke-width="3"/><polygon points="359.00,339.00 348.47,344.75 348.47,333.25" fill="#285a78"/><rect x="360" y="309" width="160" height="60" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="440" y="346" font-size="18" fill="#285a78" text-anchor="middle" font-weight="normal">Rotor / shaft</text><line x1="520" y1="339" x2="549" y2="339" stroke="#285a78" stroke-width="3"/><polygon points="549.00,339.00 538.47,344.75 538.47,333.25" fill="#285a78"/><rect x="550" y="309" width="160" height="60" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="630" y="346" font-size="18" fill="#285a78" text-anchor="middle" font-weight="normal">Generator</text><line x1="710" y1="339" x2="750" y2="339" stroke="#397f65" stroke-width="3"/><polygon points="750.00,339.00 739.47,344.75 739.47,333.25" fill="#397f65"/><rect x="750" y="309" width="145" height="60" rx="8" fill="#eaf4ef" stroke="#397f65" stroke-width="2"/><text x="822" y="346" font-size="18" fill="#397f65" text-anchor="middle" font-weight="normal">AC power</text><text x="56" y="466" font-size="22" fill="#1e2a31" text-anchor="start" font-weight="bold">Solar</text><rect x="170" y="431" width="160" height="60" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="250" y="468" font-size="18" fill="#285a78" text-anchor="middle" font-weight="normal">Irradiance</text><line x1="330" y1="461" x2="359" y2="461" stroke="#285a78" stroke-width="3"/><polygon points="359.00,461.00 348.47,466.75 348.47,455.25" fill="#285a78"/><rect x="360" y="431" width="160" height="60" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="440" y="468" font-size="18" fill="#285a78" text-anchor="middle" font-weight="normal">PV module</text><line x1="520" y1="461" x2="549" y2="461" stroke="#285a78" stroke-width="3"/><polygon points="549.00,461.00 538.47,466.75 538.47,455.25" fill="#285a78"/><rect x="550" y="431" width="160" height="60" rx="8" fill="#eef4f7" stroke="#285a78" stroke-width="2"/><text x="630" y="468" font-size="18" fill="#285a78" text-anchor="middle" font-weight="normal">Inverter</text><line x1="710" y1="461" x2="750" y2="461" stroke="#397f65" stroke-width="3"/><polygon points="750.00,461.00 739.47,466.75 739.47,455.25" fill="#397f65"/><rect x="750" y="431" width="145" height="60" rx="8" fill="#eaf4ef" stroke="#397f65" stroke-width="2"/><text x="822" y="468" font-size="18" fill="#397f65" text-anchor="middle" font-weight="normal">AC power</text><text x="480" y="550" font-size="20" fill="#1e2a31" text-anchor="middle" font-weight="normal">Each conversion stage has its own limits and outgoing energy flows.</text></g></svg>
