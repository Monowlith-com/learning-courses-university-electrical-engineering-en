<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Electromechanical coupling</title><desc>Original teaching model</desc><rect width="960" height="600" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#23486b"/></marker></defs><g font-family="Arial,sans-serif" fill="#20242b"><text x="45" y="53" font-size="28" text-anchor="start" fill="#20242b" font-weight="bold">Electromechanical coupling</text><path d="M45 80L915 80" stroke="#cbd5e1" stroke-width="1" fill="none"/><rect x="55" y="145" width="255" height="100" rx="10" fill="#e8f2fb" stroke="#23486b" stroke-width="2"/><text x="182.5" y="181" font-size="23" text-anchor="middle" fill="#20242b" font-weight="bold">u = 24 V</text><text x="182.5" y="213" font-size="19" text-anchor="middle" fill="#20242b">i = 7 A</text><rect x="355" y="145" width="255" height="100" rx="10" fill="#e8f2fb" stroke="#23486b" stroke-width="2"/><text x="482.5" y="181" font-size="23" text-anchor="middle" fill="#20242b" font-weight="bold">k i ω = 70 W</text><text x="482.5" y="213" font-size="19" text-anchor="middle" fill="#20242b">e = 10 V</text><rect x="655" y="145" width="250" height="100" rx="10" fill="#e8f2fb" stroke="#23486b" stroke-width="2"/><text x="780.0" y="181" font-size="23" text-anchor="middle" fill="#20242b" font-weight="bold">ω = 50 rad/s</text><text x="780.0" y="213" font-size="19" text-anchor="middle" fill="#20242b">Mₑ = 1.4 N·m</text><path d="M310 195L355 195" stroke="#23486b" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M610 195L655 195" stroke="#23486b" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="182" y="122" font-size="24" text-anchor="middle" fill="#20242b" font-weight="bold">Electrical</text><text x="482" y="122" font-size="24" text-anchor="middle" fill="#20242b" font-weight="bold">Conversion</text><text x="780" y="122" font-size="24" text-anchor="middle" fill="#20242b" font-weight="bold">Mechanical</text><rect x="55" y="350" width="255" height="100" rx="10" fill="#e8f2fb" stroke="#23486b" stroke-width="2"/><text x="182.5" y="386" font-size="23" text-anchor="middle" fill="#20242b" font-weight="bold">98 W</text><text x="182.5" y="418" font-size="19" text-anchor="middle" fill="#20242b">Copper losses</text><rect x="355" y="350" width="255" height="100" rx="10" fill="#e8f2fb" stroke="#23486b" stroke-width="2"/><text x="482.5" y="386" font-size="23" text-anchor="middle" fill="#20242b" font-weight="bold">50 W</text><text x="482.5" y="418" font-size="19" text-anchor="middle" fill="#20242b">Friction</text><rect x="655" y="350" width="250" height="100" rx="10" fill="#e8f2fb" stroke="#23486b" stroke-width="2"/><text x="780.0" y="386" font-size="23" text-anchor="middle" fill="#20242b" font-weight="bold">20 W</text><text x="780.0" y="418" font-size="19" text-anchor="middle" fill="#20242b">External load</text><path d="M182 245L182 350" stroke="#23486b" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M780 245L780 350" stroke="#23486b" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M700 245L483 350" stroke="#23486b" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="480" y="520" font-size="28" text-anchor="middle" fill="#20242b" font-weight="bold">168 W = 98 W + 50 W + 20 W</text><text x="480" y="560" font-size="21" text-anchor="middle" fill="#20242b">Steady-state power balance</text></g></svg>