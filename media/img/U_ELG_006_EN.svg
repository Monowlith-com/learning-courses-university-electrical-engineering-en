<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">Phasor Addition in the Complex Plane</title><desc id="desc">The phasors A, B and A plus B end at (3, 4), (4, −3) and (7, 1). Dashed lines complete the parallelogram construction.</desc>
